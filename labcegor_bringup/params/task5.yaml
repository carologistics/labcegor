clips_manager:
  ros__parameters:
    environments: ["cx_rcll"]
    cx_rcll:
      redirect_stdout_to_debug: true
      log_clips_to_file: true
      watch: ["rules", "facts"]
      plugins: ["executive",
                "ament_index",
                "config",
                "protobuf",
                "files"]
      
    ament_index:
      plugin: "cx::AmentIndexPlugin"
    config:
      plugin: "cx::ConfigPlugin"
    executive:
      plugin: "cx::ExecutivePlugin"
      publish_on_refresh: false
      assert_time: true
      refresh_rate: 10
    files:
      plugin: "cx::FileLoadPlugin"
      pkg_share_dirs: ["labcegor_bringup"]
      batch: [
        "clips/labcegor_bringup/rcll/deftemplates.clp",
        "clips/labcegor_bringup/rcll/init.clp",
        "clips/labcegor_bringup/rcll/refbox-comm-init.clp",
        "clips/labcegor_bringup/rcll/sim-comm-init.clp",
        "clips/labcegor_bringup/rcll/refbox-recv.clp",
        "clips/labcegor_bringup/rcll/task5_function.clp",
        "clips/labcegor_bringup/rcll/templates_task5.clp",
        "clips/labcegor_bringup/rcll/task5_assignment_n_machines.clp",
        "clips/labcegor_bringup/rcll/task5_production_robot.clp",
        "clips/labcegor_bringup/rcll/task5_helper_robot.clp",
        "clips/labcegor_bringup/rcll/task5_payment_robot.clp",
       ]
    protobuf:
      plugin: "cx::ProtobufPlugin"
      pkg_share_dirs: ["rcll_protobuf_msgs"]
      proto_paths: ["rcll-protobuf-msgs"]
